name: Auto Sync Game Assets

on:
  schedule:
    # Chạy vào 00:00 sáng Thứ 4 hàng tuần (Chu kỳ update của Genshin Impact)
    - cron: '0 0 * * 3'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci
        
      - name: Run Auto Sync Script
        working-directory: ./frontend
        run: npm run sync:assets
        
      - name: Check for modified files
        id: git-check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and Push changes
        if: steps.git-check.outputs.has_changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Auto-update new game assets [skip ci-if-empty]"
          branch: main
          file_pattern: frontend/public/assets/**/*.webp
          commit_user_name: "GenshinHub Bot"
          commit_user_email: "bot@genshinhub.local"
          commit_author: "GenshinHub Bot <bot@genshinhub.local>"
