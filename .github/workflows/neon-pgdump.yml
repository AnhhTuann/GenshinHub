# Free-tier durable backup path for the stateless Render backend.
# Add the Neon connection string as repository secret NEON_DATABASE_URL, then
# run this workflow manually. The dump is a private Actions artifact that
# expires after 7 days; copy it to your own storage if you need a longer trail.
name: Neon pg_dump backup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-pgdump
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ensure pg_dump is available
        run: |
          if ! command -v pg_dump >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          pg_dump --version

      - name: Create custom-format dump from Neon
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          PGCONNECT_TIMEOUT: "15"
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "NEON_DATABASE_URL repository secret is missing" >&2
            exit 1
          fi
          mkdir -p backups
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-privileges \
            --file="backups/genshinhub-neon-${stamp}.dump"
          ls -lh backups/

      - name: Upload private backup artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: genshinhub-neon-backup
          path: backups/*.dump
          retention-days: 7
          if-no-files-found: error
