# Include inside the site's server block. The storage root contains assets/.
location /assets/ {
    alias /srv/genshinhub/assets/assets/;
    autoindex off;
    disable_symlinks on;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options nosniff;
}
