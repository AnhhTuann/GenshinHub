name: Asset Audit (check-only)

# Kiểm tra asset local/persistent — READ-ONLY, không commit, không ghi DB.
#
# Workflow cũ (auto-commit webp vào main) đã được thay thế: assets giờ được
# quản lý bởi backend/scripts/sync/assetSync.ts và lưu trong ASSET_STORAGE_PATH
# (persistent, ngoài source code khi deploy VPS).
#
# Workflow này chỉ quét DB và xuất báo cáo asset thiếu/hỏng để review.

on:
  schedule:
    # 03:30 UTC hằng ngày — sau dry-run data sync (03:00 UTC)
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check assets (không tải, không ghi)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ASSET_STORAGE_PATH: ${{ github.workspace }}/assets-check
        run: |
          mkdir -p reports
          npm run sync:assets:check > reports/asset_audit.txt 2>&1 || true
          tail -20 reports/asset_audit.txt

      - name: Upload asset audit report
        uses: actions/upload-artifact@v4
        with:
          name: asset-audit-report
          path: backend/reports/asset_audit.txt
          retention-days: 30
          if-no-files-found: warn
