name: Genshin Data Sync

# Pipeline đồng bộ dữ liệu game (genshin-db -> PostgreSQL -> Next.js ISR).
#
# - Cron hằng ngày 03:00 UTC (10:00 GMT+7): chạy DRY-RUN, nếu có chênh lệch
#   sẽ tự động mở Pull Request kèm báo cáo Markdown để Admin xét duyệt.
# - workflow_dispatch:
#     action=dry-run               : chỉ kiểm tra & tạo PR (an toàn, không ghi DB).
#     action=sync-and-revalidate   : đồng bộ THẬT vào production DB rồi gọi
#                                    /api/revalidate. Job này dùng GitHub
#                                    Environment "production" — hãy cấu hình
#                                    Required reviewers trong repo settings để
#                                    đảm bảo chỉ chạy sau khi được phê duyệt.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Hành động thực hiện'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - sync-and-revalidate

permissions:
  contents: write
  pull-requests: write

jobs:
  dry-run:
    name: Dry-run diff detection
    if: github.event_name == 'schedule' || inputs.action == 'dry-run'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run dry-run sync check
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          npm run sync:check -- --report logs/sync_report_ci.md
          set -e
          [ -f logs/sync_report_ci.md ] || { echo "❌ Sync check failed to produce report"; exit 1; }
          count=$(grep -cE '^\| (create|update) \|' logs/sync_report_ci.md || true)
          echo "has_changes=$count" >> "$GITHUB_OUTPUT"
          echo "Detected $count changed entries."

      - name: Upload sync report artifact
        uses: actions/upload-artifact@v4
        with:
          name: genshin-sync-report
          path: backend/logs/sync_report_ci.md
          retention-days: 30

      - name: Open Pull Request with sync report
        if: steps.check.outputs.has_changes != '0'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/genshin-data-sync
          delete-branch: true
          commit-message: 'chore(data): sync new Genshin Impact data (dry-run report)'
          title: 'chore(data): sync new Genshin Impact data'
          body: |
            ## 🤖 Automated data sync dry-run report

            Detected differences between `genshin-db` and the production
            database. **No data has been written yet.**

            See the full diff report in `backend/logs/sync_report_ci.md` (also attached as workflow artifact).

            ### Next steps
            1. Review the report — verify no admin-managed fields are touched.
            2. Merge this PR or run the **Genshin Data Sync** workflow manually with
               `action=sync-and-revalidate` (requires `production` environment approval)
               to apply changes and revalidate the Next.js frontend.

            > *Tài nguyên hình ảnh thuộc bản quyền của miHoYo Co., Ltd.*
          labels: |
            data-sync
            automated

  sync-and-revalidate:
    name: Sync DB + revalidate frontend
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'sync-and-revalidate'
    runs-on: ubuntu-latest
    # Environment protection: cấu hình Required reviewers trong repo settings
    # để job này chỉ chạy sau khi được Admin phê duyệt.
    environment: production
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run sync (upsert + assets)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run sync:run -- --report logs/sync_report_prod.md

      - name: Upload production sync report
        uses: actions/upload-artifact@v4
        with:
          name: genshin-sync-report-prod
          path: backend/logs/sync_report_prod.md
          retention-days: 90

      - name: Revalidate Next.js frontend
        env:
          REVALIDATE_URL: ${{ secrets.FRONTEND_REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$REVALIDATE_URL" ] || [ -z "$REVALIDATE_SECRET" ]; then
            echo "⚠️  FRONTEND_REVALIDATE_URL hoặc REVALIDATE_SECRET chưa được cấu hình — bỏ qua revalidate."
            exit 0
          fi
          curl -fsS -X POST "$REVALIDATE_URL" \
            -H "Content-Type: application/json" \
            -d "{\"secret\": \"$REVALIDATE_SECRET\"}" \
            | tee revalidate_response.json

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -H "Content-Type: application/json" \
              -d '{"content": "🚨 **GenshinHub data sync FAILED** — check GitHub Actions logs."}' \
              "$DISCORD_WEBHOOK_URL"
          fi
