name: Genshin Data Sync — Check (dry-run)

# Workflow KIỂM TRA — an toàn, chỉ đọc database, không ghi gì.
#
# - Cron hằng ngày 03:00 UTC (10:00 GMT+7): kiểm tra phiên bản genshin-db mới
#   trên npm, rồi chạy --dry-run so sánh thư viện đã cài với database.
# - Nếu phát hiện create/update THẬT -> commit báo cáo vào
#   backend/reports/ và mở Pull Request để Admin review.
# - Nếu KHÔNG có thay đổi -> chỉ upload artifact, KHÔNG tạo PR rỗng.
# - Các bản ghi "pending" (thiếu dữ liệu nguồn) vẫn nằm trong report
#   chi tiết nhưng không kích hoạt PR.
#
# ⚠️ Workflow này chạy trên schedule/workflow_dispatch — KHÔNG chạy
# trên pull_request từ fork, nên secrets chỉ dùng cho code đã merge.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Hành động'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: genshin-data-sync-check
  cancel-in-progress: false

jobs:
  dry-run:
    name: Dry-run diff detection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a  # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check latest genshin-db version
        id: version
        run: |
          set -uo pipefail
          if npm run sync:version > version.json 2>version.err; then
            installed="$(jq -r '.installed' version.json)"
            latest="$(jq -r '.latest' version.json)"
            update="$(jq -r '.updateAvailable' version.json)"
            {
              echo '### genshin-db version'
              echo "- installed: \`${installed}\`"
              echo "- latest on npm: \`${latest}\`"
              echo "- update available: \`${update}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "installed=${installed}" >> "$GITHUB_OUTPUT"
            echo "latest=${latest}" >> "$GITHUB_OUTPUT"
            echo "update_available=${update}" >> "$GITHUB_OUTPUT"
            if [ "$update" = "true" ]; then
              echo "::notice::A newer genshin-db (${latest}) is available; Dependabot will open the upgrade PR separately."
            fi
          else
            echo "::warning::Could not query npm for the latest genshin-db version; continuing with the installed version only."
            cat version.err >&2 || true
            echo "update_available=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Run dry-run sync check
        id: check
        env:
          # This is the one approved staging connection string for every DB read.
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${NEON_DATABASE_URL:-}" ]; then
            echo "NEON_DATABASE_URL is not configured — skipping the read-only staging dry-run."
            echo "has_changes=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Verify the exact staging endpoint before exposing it to the sync engine.
          npm run backup:verify-db
          export DATABASE_URL="$NEON_DATABASE_URL"
          # Remove stale output so a failed check cannot reuse an earlier report.
          rm -f reports/sync_report_ci.md logs/sync_report_ci.md
          mkdir -p reports logs
          npm run sync:check -- --report reports/sync_report_ci.md
          [ -s reports/sync_report_ci.md ] || { echo "Sync check failed to produce a non-empty report"; exit 1; }
          # Count create/update only; pending entries require manual sourcing.
          count=$(grep -cE '^\| (create|update) \|' reports/sync_report_ci.md || true)
          echo "has_changes=$count" >> "$GITHUB_OUTPUT"
          echo "Detected $count applicable changed entries."
          cp reports/sync_report_ci.md logs/sync_report_ci.md

      - name: Upload sync report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: genshin-sync-report
          path: |
            backend/reports/sync_report_ci.md
            backend/logs/sync_report_ci.md
          retention-days: 30
          if-no-files-found: warn

      - name: Open Pull Request with sync report
        if: steps.check.outputs.has_changes != '0' && steps.check.outputs.has_changes != 'skip'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c  # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/genshin-data-sync
          delete-branch: true
          commit-message: 'chore(data): sync new Genshin Impact data (dry-run report)'
          title: 'chore(data): sync new Genshin Impact data'
          body: |
            ## 🤖 Automated data sync dry-run report

            Detected differences between the installed `genshin-db` version
            and the database. **No data has been written yet.**

            Full diff report: `backend/reports/sync_report_ci.md`
            (also attached as a workflow artifact).

            ### Next steps
            1. Review the report — verify no admin-managed fields are touched
               and no `pending` entries need manual data sourcing.
            2. After approval, run the **Genshin Data Sync — Apply** workflow
               manually (`sync-and-revalidate`). It requires the `production`
               environment approval and takes a verified private `pg_dump`
               backup first.

            > *Tài nguyên hình ảnh thuộc bản quyền của miHoYo Co., Ltd.*
          labels: |
            data-sync
            automated
