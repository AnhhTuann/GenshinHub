name: Genshin Data Sync — Apply (staging)

# Workflow GHI DỮ LIỆU — TÁCH RIỆNG khỏi workflow kiểm tra.
#
# Chỉ chạy thủ công (workflow_dispatch) và BẮT BUỘC qua GitHub
# Environment "staging" — cấu hình Required reviewers trong repo settings
# để có người phê duyệt trước khi job chạm database.
#
# Các bước an toàn:
#   1. Kiểm tra secret + host database staging được phê duyệt (fail-closed).
#   2. pg_dump custom-format -> pg_restore --list -> SHA-256 -> upload vào
#      bucket riêng, xác minh HeadObject. Không khôi phục, không xóa backup.
#   3. Snapshot JSON tự động bởi syncEngine, upsert không phá hủy, assets mới
#      được validate và đăng lên bucket assets riêng.
#   4. Revalidate Next.js chỉ khi mọi bước trước đó thành công.
#
# KHÔNG có trigger schedule/pull_request — staging không bị động bởi code
# chưa review. Recommendations, Teams và Tier Lists không nằm trong payload sync.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Hành động'
        required: true
        default: 'sync-and-revalidate'
        type: choice
        options:
          - sync-and-revalidate

permissions:
  contents: read

concurrency:
  group: genshin-data-sync-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Sync DB + revalidate frontend
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Validate required secrets
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ASSET_BUCKET: ${{ secrets.ASSET_BUCKET }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
          FRONTEND_REVALIDATE_URL: ${{ secrets.FRONTEND_REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          set -euo pipefail
          for name in NEON_DATABASE_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_ENDPOINT_URL_S3 AWS_REGION ASSET_BUCKET BACKUP_BUCKET FRONTEND_REVALIDATE_URL REVALIDATE_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "$name secret is missing" >&2
              exit 1
            fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a  # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Assert approved staging database branch
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npm run backup:verify-db

      - name: Install PostgreSQL client (pg_dump)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create and verify full custom-format backup
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p backups
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          file="backups/genshinhub-neon-${stamp}.dump"
          pg_dump --dbname="$NEON_DATABASE_URL" --format=custom --no-owner --no-acl --file="$file"
          pg_restore --list "$file" > "${file}.list"
          test -s "${file}.list"
          sha256sum "$file" > "${file}.sha256"
          echo "backup_filename=$(basename "$file")"
          echo "backup_size_bytes=$(stat -c '%s' "$file")"
          echo "backup_timestamp=${stamp}"
          echo "pg_restore_entries=$(wc -l < "${file}.list")"
          cat "${file}.sha256"

      - name: Upload backup to private bucket and verify objects
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          file="$(ls backups/*.dump)"
          key="pgdump/$(basename "$file")"
          npm run backup:upload -- "$file" "$key"

      - name: Re-assert approved staging database before sync
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npm run backup:verify-db

      - name: Guard Admin-managed editorial fields in the generated report
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          npm run sync:check -- --report reports/sync_report_preapply.md
          if grep -nE '^\| (create|update) \|.*`(tier|role|recommendedC|tierNoteEn|tierNoteVi|talentPriority|signatureWeapons|sands|goblet|circlet|subStatsPriority|stats|ascensionMats|talentMats|bestWeapons|bestArtifacts|teams)`' reports/sync_report_preapply.md; then
            echo 'Editorial Admin-managed fields appeared in the sync payload — aborting.' >&2
            exit 1
          fi

      - name: Run validated sync with durable asset publishing
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ASSET_BUCKET: ${{ secrets.ASSET_BUCKET }}
          ASSET_STORAGE_PATH: ${{ github.workspace }}/assets-staging
        run: npm run sync:run -- --report reports/sync_report_staging.md

      - name: Package downloaded assets
        run: |
          if [ -d "${{ github.workspace }}/assets-staging" ]; then
            tar -czf "${{ github.workspace }}/backend/assets_staging_$(date +%Y%m%d_%H%M%S).tar.gz" \
              -C "${{ github.workspace }}/assets-staging" .
            ls -lh "${{ github.workspace }}"/backend/assets_staging_*.tar.gz
          else
            echo 'Không có assets mới — bỏ qua package.'
          fi

      - name: Upload assets artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: assets-downloaded-staging
          path: backend/assets_staging_*.tar.gz
          retention-days: 30
          if-no-files-found: warn

      - name: Upload staging sync report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: genshin-sync-report-staging
          path: backend/reports/sync_report_staging.md
          retention-days: 90

      - name: Upload JSON snapshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sync-snapshots
          path: backend/backups/snapshot_*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Revalidate Next.js frontend
        env:
          REVALIDATE_URL: ${{ secrets.FRONTEND_REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          set -euo pipefail
          curl -fsS -X POST "$REVALIDATE_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"secret\": \"$REVALIDATE_SECRET\"}" | tee revalidate_response.json

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -H 'Content-Type: application/json' \
              -d '{"content": "🚨 **GenshinHub data sync FAILED** — check GitHub Actions logs."}' \
              "$DISCORD_WEBHOOK_URL"
          fi
