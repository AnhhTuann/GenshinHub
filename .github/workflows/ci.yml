name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Isolated CI Environment)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: genshinhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Use Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ── 1. Backend Setup & Migration Deploy ───────────────────────
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/genshinhub_test
        run: npx prisma generate

      - name: Validate Prisma Schema
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/genshinhub_test
        run: npx prisma validate

      - name: Deploy Prisma Migrations to CI PostgreSQL
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/genshinhub_test
        run: npx prisma migrate deploy

      - name: Seed CI Fixtures (Offline)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/genshinhub_test
        run: npm run seed:ci

      - name: Build Backend
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/genshinhub_test
        run: npm run build

      # ── 2. Backend Unit & Asset Tests ─────────────────────────────
      - name: Run Backend Version Check Tests
        working-directory: ./backend
        run: npm run test:sync:version

      - name: Run Storage and Backup Tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/genshinhub_test
          NODE_ENV: test
        run: npm run test:storage

      - name: Run Auth Tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/genshinhub_test
          NODE_ENV: test
        run: npm run test:auth

      - name: Run Asset Integration Tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/genshinhub_test
          NODE_ENV: test
        run: npm run test:assets

      # ── 3. Start Test Backend for Frontend SSG & E2E ───────────────
      - name: Start Test GraphQL Server
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/genshinhub_test
          PORT: 4000
          NODE_ENV: test
          # Evidence HMAC only (not an authentication secret).
          ADMIN_JWT_SECRET: ci-test-evidence-hmac-not-production
          FRONTEND_URL: http://localhost:3000
        run: |
          node dist/src/index.js &
          echo "Test GraphQL server started in background"

      - name: Wait for Test GraphQL Server
        run: |
          for i in {1..30}; do
            if curl -s -f http://localhost:4000/graphql -H "Content-Type: application/json" -d '{"query":"{ tierRanks { id } }"}' > /dev/null 2>&1; then
              echo "GraphQL server is ready and responsive on :4000"
              exit 0
            fi
            echo "Waiting for GraphQL server... ($i/30)"
            sleep 1
          done
          echo "ERROR: GraphQL server failed to start within 30s"
          exit 1

      # ── 4. Frontend Lint, Typecheck & Prerender Build ──────────────
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Type-check Frontend
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run Frontend Unit Tests
        working-directory: ./frontend
        run: npx vitest run

      - name: Build Frontend (SSG Prerender with Local GraphQL)
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_GRAPHQL_URL: http://localhost:4000/graphql
        run: npm run build

      # ── 5. Integration Tests ──────────────────────────────────────
      - name: Run Data Sync E2E Integration Tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/genshinhub_test
          GRAPHQL_URL: http://localhost:4000/graphql
          NODE_ENV: test
        run: npm run sync:e2e
